[project]
name = "taxdome-mcp"
version = "1.1.0"
description = "Connect TaxDome to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server and REST API for accounting firms. Unofficial, not affiliated with TaxDome."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["taxdome", "taxdome api", "taxdome mcp", "accounting", "accounting", "appointments", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business :: Scheduling"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/taxdome-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=taxdome"
Source = "https://github.com/cotlet-connect/taxdome-mcp"

[project.scripts]
taxdome-mcp = "taxdome_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"taxdome_agent.py" = "taxdome_agent.py"

[tool.hatch.build.targets.sdist]
include = ["taxdome_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
