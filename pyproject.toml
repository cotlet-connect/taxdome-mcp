[project]
name = "squire-mcp"
version = "1.1.0"
description = "Connect Squire to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server and REST API for barbershops. Unofficial, not affiliated with Squire."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["squire", "squire api", "squire mcp", "barbershop", "barber", "appointments", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business :: Scheduling"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/squire-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=squire"
Source = "https://github.com/cotlet-connect/squire-mcp"

[project.scripts]
squire-mcp = "squire_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"squire_agent.py" = "squire_agent.py"

[tool.hatch.build.targets.sdist]
include = ["squire_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
